services:
  - type: web
    name: notewell
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set this in the dashboard, never in the repo
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.11"